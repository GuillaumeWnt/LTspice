[project]
name = "ltspice"
version = "0.1.0"
description = "LTspice multi-project simulation hub and Python automation framework"
readme = "README.md"
authors = [
    { name = "GuillaumeWnt", email = "guillaume.winant@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.21.4",
]

[project.scripts]
ltspice-run = "ltspice.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["_Tools/ltspice"]
